name: Starttijd-checker

on:
  schedule:
    - cron: "*/10 5-20 * * *"   # elke 10 min, ca. 06:00–22:00 Nederlandse tijd
  workflow_dispatch:            # handmatig starten via de knop 'Run workflow'

permissions:
  contents: write

concurrency:
  group: starttijd
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check starttijden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check.py
      - name: Onthoud wat al gemeld is
        run: |
          if [ -n "$(git status --porcelain gezien.json)" ]; then
            git config user.name "starttijd-checker"
            git config user.email "actions@users.noreply.github.com"
            git add gezien.json
            git commit -m "Gemelde starttijden bijgewerkt"
            git push
          fi
